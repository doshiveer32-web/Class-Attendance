<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap Grid Example</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Our CSS -->
    <link rel="stylesheet" href="exp5.css">
</head>

<body>

    <div class="container">
        <h1 class="text-center my-4">Responsive Bootstrap Grid</h1>

        <div class="row">

            <div class="col-lg-4 col-md-6 col-12">
                <div class="box">
                    <h3>HTML</h3>
                    <p>HTML is used to create the structure of a webpage.</p>
                    <button onclick="showMessage('HTML')">Learn More</button>
                </div>
            </div>

            <div class="col-lg-4 col-md-6 col-12">
                <div class="box">
                    <h3>CSS</h3>
                    <p>CSS is used to design and style a webpage.</p>
                    <button onclick="showMessage('CSS')">Learn More</button>
                </div>
            </div>

            <div class="col-lg-4 col-md-12 col-12">
                <div class="box">
                    <h3>JavaScript</h3>
                    <p>JavaScript is used to add functionality to a webpage.</p>
                    <button onclick="showMessage('JavaScript')">Learn More</button>
                </div>
            </div>

        </div>
    </div>

    <!-- Our JavaScript -->
    <script src="exp5.js"></script>

</body>
</html>
