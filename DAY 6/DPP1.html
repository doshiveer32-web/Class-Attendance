<!DOCTYPE html>
<html>
 
<head>
 
    <!-- Title displayed on the browser tab -->
    <title>Student Marks Chart</title>
 
    <!-- Import the Chart.js library from the CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
 
    <style>
 
        /* Style for the container that holds the chart */
        .chart-container {
 
            /* Set the width of the chart container */
            width: 400px;
 
            /* Set the height of the chart container */
            height: 300px;
 
            /* Center the container horizontally with a top and bottom margin of 30px */
            margin: 30px auto;
        }
 
        /* Center-align the heading */
        h2 {
            text-align: center;
        }
 
    </style>
 
</head>
 
<body>
 
    <!-- Heading displayed on the webpage -->
    <h2>Student Marks Visualization</h2>
 
    <!-- Container that holds the canvas -->
    <div class="chart-container">
 
        <!-- Canvas where Chart.js will draw the graph -->
        <canvas id="marksChart"></canvas>
 
    </div>
 
    <script>
 
        // Select the canvas element using its ID and store it in the variable 'ctx'
        const ctx = document.getElementById('marksChart');
 
        // Create a new Chart object
        new Chart(ctx, {
 
            // Specify the type of chart
            type: 'bar',
 
            // Data to be displayed on the chart
            data: {
 
                // Labels displayed on the X-axis
                labels: ['Amit', 'Riya', 'Suman', 'Rahul'],
 
                // Dataset containing the chart values
                datasets: [{
 
                    // Name displayed in the chart legend
                    label: 'Marks',
 
                    // Marks corresponding to each student
                    data: [85, 90, 70, 60],
 
                    // Fill color of each bar
                    backgroundColor: [
                        'red',
                        'blue',
                        'green',
                        'orange'
                    ],
 
                    // Border color of each bar
                    borderColor: [
                        'darkred',
                        'darkblue',
                        'darkgreen',
                        'darkorange'
                    ],
 
                    // Thickness of the border around each bar
                    borderWidth: 2
 
                }]
            },
 
            // Additional settings for the chart
            options: {
 
                // Automatically resize the chart according to the browser window
                responsive: true,
 
                // Allow the chart to use the specified container height and width
                maintainAspectRatio: false,
 
                // Configure chart plugins
                plugins: {
 
                    // Settings for the legend
                    legend: {
 
                        // Display the legend on the chart
                        display: true
                    }
                },
 
                // Configure the chart axes
                scales: {
 
                    // Settings for the Y-axis
                    y: {
 
                        // Start the Y-axis from 0
                        beginAtZero: true
                    }
                }
 
            }
 
        });
 
    </script>
 
</body>
 
</html>
