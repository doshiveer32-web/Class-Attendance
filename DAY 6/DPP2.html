<!DOCTYPE html>
<html>
<head>
    <title>Real-Time Data Visualization</title>
 
    <!-- Import Chart.js library -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
 
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
        }
 
        .chart-container {
            width: 700px;
            height: 400px;
            margin: 30px auto;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
        }
    </style>
</head>
 
<body>
 
    <h2>Real-Time Temperature Monitoring</h2>
 
    <p>
        The chart automatically adds a new temperature value every two seconds.
    </p>
 
    <!-- Container for the chart -->
    <div class="chart-container">
 
        <!-- Canvas where Chart.js draws the chart -->
        <canvas id="temperatureChart"></canvas>
 
    </div>
 
    <script>
 
        // Select the canvas element
        const chartCanvas =
            document.getElementById("temperatureChart");
 
        // Arrays used to store time labels and temperature values
        const timeLabels = [];
        const temperatureData = [];
 
        // Create the line chart
        const temperatureChart = new Chart(chartCanvas, {
 
            // Type of chart
            type: "line",
 
            // Data displayed in the chart
            data: {
 
                // Time values displayed on the X-axis
                labels: timeLabels,
 
                datasets: [
                    {
                        // Name displayed in the legend
                        label: "Temperature in °C",
 
                        // Temperature values displayed on the Y-axis
                        data: temperatureData,
 
                        // Line appearance
                        borderColor: "blue",
                        backgroundColor: "lightblue",
                        borderWidth: 2,
 
                        // Fill the area below the line
                        fill: false,
 
                        // Smoothness of the line
                        tension: 0.3
                    }
                ]
            },
 
            // Chart settings
            options: {
 
                // Chart adjusts according to screen size
                responsive: true,
 
                // Chart follows the container size
                maintainAspectRatio: false,
 
                plugins: {
                    title: {
                        display: true,
                        text: "Live Temperature Data"
                    },
 
                    legend: {
                        display: true
                    }
                },
 
                scales: {
                    y: {
                        beginAtZero: true,
 
                        // Suggested temperature range
                        suggestedMax: 50,
 
                        title: {
                            display: true,
                            text: "Temperature in °C"
                        }
                    },
 
                    x: {
                        title: {
                            display: true,
                            text: "Time"
                        }
                    }
                }
            }
        });
 
        // Function used to generate and display new data
        function addNewTemperature() {
 
            // Generate a random temperature between 20°C and 40°C
            const newTemperature =
                Math.floor(Math.random() * 21) + 20;
 
            // Get the current time
            const currentTime =
                new Date().toLocaleTimeString();
 
            // Add current time to the labels array
            timeLabels.push(currentTime);
 
            // Add new temperature to the data array
            temperatureData.push(newTemperature);
 
            // Keep only the latest 10 readings
            if (timeLabels.length > 10) {
 
                // Remove the oldest time
                timeLabels.shift();
 
                // Remove the oldest temperature
                temperatureData.shift();
            }
 
            // Redraw the chart using the latest data
            temperatureChart.update();
        }
 
        // Add the first reading immediately
        addNewTemperature();
 
        // Call the function every 2 seconds
        setInterval(addNewTemperature, 2000);
 
    </script>
 
</body>
</html>
