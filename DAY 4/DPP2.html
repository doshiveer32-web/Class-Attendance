<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Europeana API Example</title>
<style> body {
font-family: Arial, sans-serif; background-color: #f4f4f9; color: #333;
text-align: center; padding: 20px;
}
 
button {
padding: 10px 20px; background-color: #3498db; color: white;
border: none; border-radius: 5px; cursor: pointer;
}
 
button:hover {
background-color: #2980b9;
}
 
#results {
margin-top: 20px; display: flex;
flex-wrap: wrap; justify-content: center; gap: 15px;
}
 
.item {
background-color: white; border: 1px solid #ccc; border-radius: 8px; width: 250px;
padding: 10px;
}
 
.item img { width: 100%; height: auto;
border-radius: 5px;
}
 
.item h3 {
font-size: 1em; margin: 10px 0;
}
</style>
</head>
<body>
<h1>Europeana Art Viewer 🖼</h1>
<p>Click the button to load art related to "Van Gogh".</p>
 
<button id="fetchButton">Show Art</button>
 
<div id="results"></div>
 
<script>
const button = document.getElementById("fetchButton"); const results = document.getElementById("results");
 
const apiKey = "apheiarsiove"; const query = "van gogh";
const apiUrl = `https://api.europeana.eu/record/v2/search.json?wskey=${apiKey}&query=${query}&rows=9`;
 
async function fetchArt() { results.innerHTML = "<p>Loading...</p>";
 
try {
const response = await fetch(apiUrl);
if (!response.ok) throw new Error("Network error");
 
const data = await response.json(); results.innerHTML = "";
 
if (data.itemsCount > 0) { data.items.forEach(item => {
const div = document.createElement("div"); div.className = "item";
 
const title = item.title ? item.title[0] : "No Title";
const imgUrl = item.edmIsShownBy ? item.edmIsShownBy[0] : "";
 
div.innerHTML = `
<h3>${title}</h3>
${imgUrl ? `<img src="${imgUrl}" alt="${title}">` : "<p>No image available</p>"}
`;
 
results.appendChild(div);
});
} else {
results.innerHTML = "<p>No results found.</p>";
}
 
} catch (error) {
results.innerHTML = `<p style="color:red;">Error: ${error.message}</p>`;
 
}
}
 
button.addEventListener("click", fetchArt);
</script>
 
</body>
</html>
