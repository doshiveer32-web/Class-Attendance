<html>
<head>
<title> API</title>
</head>
<body><p> Weather Information</p>
<div id="weatherData"></div>
 
    <script>
        const options ={
            method: "GET",
            headers: {accept: "application/json"},
                    };
 
                fetch
                (
                    "https://api.tomorrow.io/v4/weather/realtime?location=toronto&apikey=8DRa71CBFnhb4DTwy5lTQI5ZuAmsaTf3",
                    options
                )
                .then((response)=>response.json())
                .then((response)=>{
                    const weatherData= JSON.stringify(response, null, 2);
                    document.getElementById("weatherData").textContent=weatherData;
                                })
                                .catch((err)=>console.error(err));
</script>
</body>
</html>
