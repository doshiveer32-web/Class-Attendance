<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Random Dog</title>
    <style>
        body{margin:0;font-family:Arial,Helvetica,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;background:#f7f7f7}
        .card{background:#fff;padding:20px;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,.08);width:360px;text-align:center}
        button{padding:8px 12px;border:none;background:#1976d2;color:#fff;border-radius:4px;cursor:pointer}
        img{max-width:100%;border-radius:6px;margin-top:12px}
    </style>
</head>
<body>
    <div class="card">
        <button id="load-dog">Load Dog</button>
        <div><img id="dog-img" src="" alt="random dog"></div>
    </div>
    <script>
        document.getElementById('load-dog').addEventListener('click', async function(){
            try{
                const r = await fetch('https://dog.ceo/api/breeds/image/random');
                const j = await r.json();
                document.getElementById('dog-img').src = j.message || '';
            }catch(e){
                document.getElementById('dog-img').src = '';
            }
        });
    </script>
</body>
</html>
