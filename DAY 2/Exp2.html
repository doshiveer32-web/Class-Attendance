<!DOCTYPE html>
<html>
<head>
    <title>Calendar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="calendar">
    <div id="clock"></div>
    <h2 id="monthYear"></h2>

    <table>
        <tr>
            <th>Sun</th>
            <th>Mon</th>
            <th>Tue</th>
            <th>Wed</th>
            <th>Thu</th>
            <th>Fri</th>
            <th>Sat</th>
        </tr>
        <tbody id="dates"></tbody>
    </table>
</div>

<script src="cal&time.js"></script>
</body>
</html>
